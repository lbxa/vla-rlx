[project]
name = "sim"
version = "0.1.0"
description = "Small MuJoCo task environments for the SO101 arm"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "modal>=1.5.5",
    "mujoco",
    "numpy>=2.5.3",
]

[project.scripts]
sim = "sim.launch:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sim", "sim.envs"]
package-dir = { sim = "." }

[tool.setuptools.package-data]
sim = ["scene.xml", "assets/*.xml", "assets/*.urdf", "assets/README.md", "assets/assets/*.stl"]
